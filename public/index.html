<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wecsord</title>
<style>
:root{--bg:#07090e;--panel:#0d1119;--panel2:#111722;--line:#202838;--text:#eef2f8;--muted:#8994a8;--accent:#7567f4;--accent2:#9b91ff;--good:#45d39c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
#app{height:100vh;display:grid;grid-template-columns:76px 250px 1fr 245px}
.rail{background:#06080c;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.logo{height:52px;border-radius:17px;background:linear-gradient(135deg,var(--accent),#4f43bd);display:grid;place-items:center;font-size:23px;font-weight:900}
.rail button{height:48px;border:1px solid transparent;border-radius:14px;background:#111620;color:#aeb8ca;font-size:19px}.rail button:hover{background:#1a2030;color:#fff;border-color:#2b3447}
.rail .add{color:#7ce3b6}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:15px;overflow:auto}
.brandrow{display:flex;align-items:center;font-size:18px;font-weight:900;padding:4px 3px 18px}.brandrow span{color:var(--accent2)}.smalladd{margin-left:auto;background:none;border:0;color:#8d98ab;font-size:22px}
.label{font-size:10px;letter-spacing:.12em;color:#687388;text-transform:uppercase;margin:18px 7px 8px}
.listitem{display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;color:#9ea9bb;margin:2px 0}.listitem:hover,.listitem.active{background:#181e2a;color:#fff}
.channel{padding:8px 10px;color:#8e99ac;border-radius:9px;cursor:pointer}.channel:hover{background:#151b26;color:#fff}.channel b{font-size:16px;margin-right:7px;color:#677389}
.center{min-width:0;background:#0c1017;display:flex;flex-direction:column}
.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.topname{font-weight:850;font-size:16px}.topsub{color:#69758a;font-size:12px}.spacer{flex:1}
.top button,.profilebar button{border:1px solid #2a3344;background:#141a24;color:#dce3ef;border-radius:10px;padding:8px 11px}
.chat{flex:1;overflow:auto;padding:25px}
.welcome{max-width:720px;margin:55px auto;text-align:center;color:var(--muted)}.welcome h1{color:#fff;font-size:30px;margin-bottom:8px}
.message{display:flex;gap:11px;padding:8px;border-radius:9px}.message:hover{background:#10151e}.avatar{width:38px;height:38px;border-radius:12px;background:#252c3a;display:grid;place-items:center;overflow:hidden;flex:none;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}
.author{font-weight:800}.time{font-size:11px;color:#667287;margin-left:8px}.body{color:#c6cedb;margin-top:3px;white-space:pre-wrap}
.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;background:#151b25;border:1px solid #293244;color:#fff;border-radius:12px;padding:12px 13px;outline:0}.send{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 17px;font-weight:800}
.right{background:var(--panel);border-left:1px solid var(--line);padding:15px;overflow:auto}.member{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px}.member:hover{background:#151b25}.status{width:8px;height:8px;border-radius:50%;background:var(--good)}.muted{color:var(--muted);font-size:12px}
.card{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:100}.box{width:min(450px,92vw);background:#101620;border:1px solid #2a3446;border-radius:18px;padding:22px;box-shadow:0 30px 100px #000}
.box input{width:100%;margin:6px 0;background:#151b25;border:1px solid #2a3446;color:#fff;padding:11px;border-radius:10px;outline:0}.row{display:flex;gap:8px;margin-top:10px}.primary{flex:1;background:var(--accent);border:0;color:#fff;border-radius:10px;padding:11px;font-weight:800}.secondary{flex:1;background:#171e29;border:1px solid #2a3446;color:#fff;border-radius:10px;padding:11px}
.hidden{display:none!important}
.call{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(850px,90vw);height:min(620px,88vh);background:#090d14;border:1px solid #2d384b;border-radius:20px;box-shadow:0 30px 120px #000;display:flex;flex-direction:column}
.callhead{height:58px;padding:0 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.callbody{flex:1;display:grid;grid-template-columns:1fr 250px;min-height:0}.stage{position:relative;background:#030509;display:grid;place-items:center}.stage video{width:100%;height:100%;object-fit:contain}.off{color:#606c80}.callchat{border-left:1px solid var(--line);display:flex;flex-direction:column}.callmsgs{flex:1;overflow:auto;padding:12px}.callinput{display:flex;padding:10px;gap:6px;border-top:1px solid var(--line)}.callinput input{min-width:0;flex:1;background:#151b25;border:1px solid #293244;color:#fff;border-radius:9px;padding:9px}.controls{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.controls button{background:#171e2a;color:#fff;border:1px solid #293345;border-radius:10px;padding:10px 13px}.controls .hang{background:#c84b62;border-color:#c84b62}
.notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#151d29;border:1px solid #2c384b;padding:10px 15px;border-radius:10px;z-index:200}
@media(max-width:850px){#app{grid-template-columns:60px 190px 1fr}.right{display:none}.call{width:96vw}.callbody{grid-template-columns:1fr 190px}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="notice" class="notice hidden"></div>
<script>
const socket=window.io?io():null;
let me=JSON.parse(localStorage.getItem("wecsordUser")||"null");
let spaces=[],friends=[],currentSpace=null,currentChannel=null,voiceId=null,stream=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avatar=u=>u?.avatar?`<img src="${esc(u.avatar)}">`:esc((u?.displayName||u?.username||"?")[0].toUpperCase());
function notice(t){const n=$("#notice");n.textContent=t;n.classList.remove("hidden");setTimeout(()=>n.classList.add("hidden"),2200)}
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}

function auth(){
 $("#modal").innerHTML=`<div class="modal"><div class="box">
 <h2 style="margin:0 0 7px">Добро пожаловать в <span style="color:#9b91ff">Wecsord</span></h2>
 <p class="muted">Твой User остаётся постоянным. Имя можно менять.</p>
 <input id="au" placeholder="User123 — только English" autocomplete="username">
 <input id="an" placeholder="Отображаемое имя">
 <input id="ap" type="password" placeholder="Пароль (6+ символов)" autocomplete="current-password">
 <div class="row"><button class="primary" onclick="reg()">Создать User</button><button class="secondary" onclick="login()">Войти</button></div>
 </div></div>`;
}
async function reg(){try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({username:$("#au").value,password:$("#ap").value,displayName:$("#an").value})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));$("#modal").innerHTML="";boot()}catch(e){notice(e.message)}}
async function login(){try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("#au").value,password:$("#ap").value})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));$("#modal").innerHTML="";boot()}catch(e){notice(e.message)}}

function shell(){
 $("#app").innerHTML=`<nav class="rail">
 <div class="logo">W</div><button onclick="home()" title="Главная">⌂</button><button onclick="findFriend()" title="Друзья">♟</button><button class="add" onclick="createSpace()" title="Создать Space">＋</button>
 <div style="flex:1"></div><button onclick="profile()" title="Профиль">⚙</button></nav>
 <aside class="sidebar"><div class="brandrow">W<span>ecsord</span><button class="smalladd" onclick="createSpace()">＋</button></div>
 <div class="label">Мои Spaces</div><div id="spaces"></div>
 <div class="label">Каналы</div><div id="channels"></div>
 <div class="label">Друзья</div><div id="friends"></div></aside>
 <main class="center"><header class="top"><span id="ico">◆</span><div><div class="topname" id="title">Главная</div><div class="topsub" id="sub">Твой Wecsord</div></div><div class="spacer"></div><button onclick="startCall()">📞 Звонок</button><button onclick="profile()">👤</button></header>
 <section class="chat" id="chat"></section><div class="composer"><input id="text" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">Отправить</button></div></main>
 <aside class="right"><div class="label">Участники</div><div id="members"></div><div class="card"><div class="member"><div class="avatar">${avatar(me)}</div><div><b>${esc(me.displayName)}</b><div class="muted">@${esc(me.username)}</div></div></div><button class="secondary" style="width:100%;margin-top:8px" onclick="profile()">Настроить профиль</button></div></aside>`;
}
function drawSpaces(){ $("#spaces").innerHTML=spaces.map(s=>`<div class="listitem ${currentSpace?.id===s.id?"active":""}" onclick="selectSpace('${s.id}')">◆ ${esc(s.name)}</div>`).join("")||`<div class="muted" style="padding:8px">Пока нет Spaces</div>`;$("#friends").innerHTML=friends.map(f=>`<div class="member"><span class="status"></span>${esc(f.displayName)}</div>`).join("")||`<div class="muted" style="padding:8px">Добавь друзей</div>`}
function drawChannels(){const el=$("#channels");el.innerHTML=currentSpace?currentSpace.channels.map(c=>`<div class="channel" onclick='openChannel(${JSON.stringify(c)})'><b>${c.type==="voice"?"🔊":"#"} </b>${esc(c.name)}</div>`).join(""):`<div class="muted" style="padding:8px">Выбери Space</div>`}
function home(){currentSpace=null;currentChannel=null;drawSpaces();drawChannels();$("#title").textContent="Главная";$("#sub").textContent="Wecsord";$("#chat").innerHTML=`<div class="welcome"><h1>Добро пожаловать, ${esc(me.displayName)} 👋</h1><p>Создавай свои Spaces, добавляй друзей и общайся. Окно звонка содержит видео, участников и чат одновременно.</p><button class="primary" style="max-width:220px" onclick="createSpace()">＋ Создать Space</button></div>`;$("#members").innerHTML=friends.map(f=>`<div class="member"><div class="avatar">${avatar(f)}</div><div><b>${esc(f.displayName)}</b><div class="muted">в сети</div></div></div>`).join("")}
function selectSpace(id){currentSpace=spaces.find(s=>s.id===id);drawSpaces();drawChannels();$("#members").innerHTML=currentSpace.members.map(x=>`<div class="member"><span class="status"></span>${x===me.id?esc(me.displayName):"Участник"}</div>`).join("");const c=currentSpace.channels.find(x=>x.type==="text")||currentSpace.channels[0];openChannel(c)}
async function openChannel(c){currentChannel=c;$("#title").textContent=c.name;$("#sub").textContent=c.type==="voice"?"Голосовая комната":"Текстовый канал";if(c.type==="text"){socket?.emit("chat:join",c.id);const d=await api("/api/messages/"+c.id);renderMessages(d.messages)}else{$("#chat").innerHTML=`<div class="welcome"><h1>🔊 ${esc(c.name)}</h1><p>Нажми «Звонок». Чат не исчезнет — он будет справа внутри окна звонка.</p><button class="primary" style="max-width:180px" onclick="startCall()">📞 Войти в звонок</button></div>`}}
function renderMessages(ms){$("#chat").innerHTML=ms.map(messageHTML).join("");$("#chat").scrollTop=999999}
function messageHTML(m){return `<div class="message"><div class="avatar">${avatar({displayName:m.userId===me.id?me.displayName:"U"})}</div><div><span class="author">${m.userId===me.id?esc(me.displayName):"Участник"}</span><span class="time">${new Date(m.at).toLocaleTimeString()}</span><div class="body">${esc(m.text)}</div></div></div>`}
function send(){if(!currentChannel||currentChannel.type!=="text")return notice("Выбери текстовый канал");const t=$("#text").value.trim();if(!t)return;socket?.emit("chat:send",{channelId:currentChannel.id,userId:me.id,text:t});$("#text").value=""}
socket?.on("chat:message",m=>{if(m.channelId===currentChannel?.id){$("#chat").insertAdjacentHTML("beforeend",messageHTML(m));$("#chat").scrollTop=999999}});
async function createSpace(){const name=prompt("Название нового Space:","Мой клуб");if(!name)return;try{const d=await api("/api/spaces",{method:"POST",body:JSON.stringify({ownerId:me.id,name})});spaces.push(d.space);selectSpace(d.space.id);notice("Space создан! Код приглашения: "+d.space.invite)}catch(e){notice(e.message)}}
async function findFriend(){const q=prompt("Введи точный User друга (например User123):");if(!q)return;try{const d=await api("/api/search/users?q="+encodeURIComponent(q));const u=d.users.find(x=>x.username.toLowerCase()===q.toLowerCase());if(!u)return notice("User не найден");await api("/api/friends/request",{method:"POST",body:JSON.stringify({from:me.id,to:u.id})});notice("Заявка отправлена")}catch(e){notice(e.message)}}
function profile(){$("#modal").innerHTML=`<div class="modal"><div class="box"><h2 style="margin-top:0">Профиль</h2><div class="muted" style="margin-bottom:12px">Постоянный User: <b style="color:#fff">@${esc(me.username)}</b></div><input id="pn" value="${esc(me.displayName)}" placeholder="Имя"><input id="pg" value="${esc(me.game||"")}" placeholder="Игра / статус"><input id="pa" placeholder="Ссылка на аватар"><div class="row"><button class="primary" onclick="saveProfile()">Сохранить</button><button class="secondary" onclick="closeModal()">Закрыть</button></div></div></div>`}
async function saveProfile(){try{const d=await api("/api/users/"+me.id,{method:"PATCH",body:JSON.stringify({displayName:$("#pn").value,game:$("#pg").value,avatar:$("#pa").value||me.avatar})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));closeModal();shell();drawSpaces();drawChannels();home();notice("Профиль сохранён")}catch(e){notice(e.message)}}
function closeModal(){$("#modal").innerHTML=""}

async function startCall(){showCall(currentChannel||{id:"lobby",name:"Общение",type:"voice"})}
async function showCall(c){$("#modal").innerHTML=`<div class="call"><div class="callhead"><b>🔊 ${esc(c.name)}</b><span class="muted">• голосовой канал</span><div class="spacer"></div><button class="secondary" style="padding:7px 10px" onclick="closeCall()">×</button></div><div class="callbody"><div class="stage"><video id="video" autoplay muted playsinline></video><div id="off" class="off">Камера выключена</div></div><div class="callchat"><div class="callmsgs" id="callmsgs"></div><div class="callinput"><input id="ct" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')callSend()"><button class="send" onclick="callSend()">→</button></div></div></div><div class="controls"><button onclick="mic()">🎙️ Микрофон</button><button onclick="cam()">📹 Камера</button><button onclick="screenShare()">🖥️ Экран</button><button class="hang" onclick="closeCall()">Завершить</button></div></div>`;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});$("#video").srcObject=stream;$("#off").classList.add("hidden")}catch(e){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});notice("Камера недоступна — микрофон включён")}catch(e2){notice("Разреши микрофон в браузере")}}
 voiceId=c.id;socket?.emit("voice:join",{channelId:c.id,user:{id:me.id,displayName:me.displayName}})}
function callSend(){const t=$("#ct").value.trim();if(!t)return;$("#callmsgs").insertAdjacentHTML("beforeend",`<div style="margin-bottom:7px"><b>${esc(me.displayName)}</b>: ${esc(t)}</div>`);$("#ct").value=""}
function mic(){const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;notice(t.enabled?"Микрофон включён":"Микрофон выключен")}}
function cam(){const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$("#off").classList.toggle("hidden",t.enabled)}}
async function screenShare(){try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});$("#video").srcObject=s;s.getVideoTracks()[0].onended=()=>$("#video").srcObject=stream}catch(e){notice("Демонстрация экрана отменена")}}
function closeCall(){if(voiceId)socket?.emit("voice:leave",voiceId);stream?.getTracks().forEach(t=>t.stop());stream=null;$("#modal").innerHTML=""}
socket?.on("voice:user-joined",d=>notice(d.user.displayName+" вошёл в звонок"));
socket?.on("voice:user-left",()=>notice("Участник вышел из звонка"));
socket?.on("friend:accepted",u=>{friends.push(u);drawSpaces();notice("Добавлен друг: "+u.displayName)});
socket?.on("friend:request",u=>notice("Новая заявка от @"+u.username));

async function boot(){shell();socket?.emit("user:online",me.id);try{spaces=(await api("/api/spaces/"+me.id)).spaces;friends=(await api("/api/users/"+me.id+"/friends")).friends}catch(e){}drawSpaces();drawChannels();home()}
if(me)boot();else auth();
</script>
</body>
</html>
