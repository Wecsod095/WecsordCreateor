<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wecsord</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#080a0f;color:#e8ecf5;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:72px 230px 1fr 230px;background:#0b0e14}
.rail{background:#07090d;border-right:1px solid #171b24;padding:12px 10px;display:flex;flex-direction:column;gap:10px}.brand{width:50px;height:50px;border-radius:16px;background:#6c5ce7;display:grid;place-items:center;font-weight:900}.rail button{width:50px;height:50px;border:0;border-radius:15px;background:#121722;color:#aeb7ca}.rail button:hover{background:#1b2230;color:white}.rail .plus{color:#72e2bd}
.side{background:#0e121a;border-right:1px solid #171b24;padding:16px;overflow:auto}.title{font-weight:800;font-size:18px;margin-bottom:16px}.label{font-size:11px;color:#707a8e;text-transform:uppercase;letter-spacing:.08em;margin:18px 8px 8px}.item{padding:9px 10px;border-radius:9px;color:#9fa9bc;display:flex;align-items:center;gap:8px}.item.active,.item:hover{background:#171d29;color:#fff}.plusbtn{margin-left:auto;border:0;background:none;color:#8d98ad;font-size:20px}.main{display:flex;flex-direction:column;min-width:0;background:#0d1118}.top{height:64px;border-bottom:1px solid #191e28;display:flex;align-items:center;padding:0 20px;gap:12px}.top .name{font-weight:800}.pill{margin-left:auto;background:#151b26;border:1px solid #232b3a;padding:7px 10px;border-radius:10px;color:#aeb8ca}.messages{flex:1;overflow:auto;padding:24px}.welcome{max-width:720px;margin:40px auto;color:#8f99ad;text-align:center}.bubble{display:flex;gap:12px;padding:9px 8px;border-radius:10px}.bubble:hover{background:#111722}.avatar{width:38px;height:38px;border-radius:12px;background:#242b3a;display:grid;place-items:center;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.msgname{font-weight:700}.time{font-size:11px;color:#687286;margin-left:8px}.text{margin-top:3px;color:#c4ccda;white-space:pre-wrap;word-break:break-word}.composer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid #191e28}.composer input,.modal input{flex:1;background:#151a24;border:1px solid #252d3c;border-radius:12px;padding:12px;color:white;outline:none}.composer button,.primary{border:0;border-radius:12px;padding:0 16px;background:#6c5ce7;color:white;font-weight:700}.right{background:#0e121a;border-left:1px solid #171b24;padding:16px;overflow:auto}.member{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}.member:hover{background:#151a23}.dot{width:8px;height:8px;border-radius:50%;background:#55d6a5}.profile{border-top:1px solid #202633;margin-top:18px;padding-top:16px}.profile button,.ghost{width:100%;margin-top:8px;padding:10px;border:1px solid #283042;background:#151a23;color:#dce3f0;border-radius:10px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20}.card{width:min(440px,92vw);background:#10151f;border:1px solid #273043;border-radius:18px;padding:22px;box-shadow:0 20px 80px #000b}.card h2{margin:0 0 14px}.card input{width:100%;margin:6px 0}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.call{position:fixed;right:250px;bottom:24px;width:min(700px,70vw);height:410px;background:#0b0f17;border:1px solid #2b3548;border-radius:18px;z-index:10;box-shadow:0 20px 80px #000b;display:flex;flex-direction:column}.callhead{padding:12px 16px;border-bottom:1px solid #222a37;display:flex;gap:8px;align-items:center}.callbody{flex:1;display:grid;grid-template-columns:1fr 220px;min-height:0}.video{background:#05070a;position:relative;display:grid;place-items:center}.video video{width:100%;height:100%;object-fit:contain}.callchat{border-left:1px solid #222a37;display:flex;flex-direction:column}.callchat .msgs{flex:1;overflow:auto;padding:10px}.callcontrols{padding:10px;display:flex;gap:8px;border-top:1px solid #222a37}.callcontrols button{border:0;background:#18202d;color:#fff;border-radius:10px;padding:10px 12px}.danger{background:#c7475d!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#151c28;border:1px solid #2a3447;padding:10px 16px;border-radius:10px;z-index:50}
</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toast" class="hidden"></div>
<script>
const socket=io();let me=JSON.parse(localStorage.getItem("wecsordUser")||"null"),spaces=[],friends=[],currentSpace=null,currentChannel=null,voiceChannel=null,localStream=null,peers={};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const x=$("#toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2200)}
function av(u){return u?.avatar?`<img src="${u.avatar}">`:esc((u?.displayName||u?.username||"?")[0].toUpperCase())}
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
function showAuth(){ $("#modal").innerHTML=`<div class="modal"><div class="card"><h2>Добро пожаловать в Wecsord</h2><p style="color:#8f99ad">Свой чат, клубы и звонки — в одном месте.</p><input id="un" placeholder="User123 (только English)" autocomplete="username"><input id="dn" placeholder="Имя"><input id="pw" type="password" placeholder="Пароль"><div class="row"><button class="primary" onclick="register()">Создать User</button><button class="ghost" onclick="login()">Войти</button></div></div></div>`}
async function register(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({username:$("#un").value,password:$("#pw").value,displayName:$("#dn").value})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));$("#modal").innerHTML="";start()}catch(e){toast(e.message)}}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("#un").value,password:$("#pw").value})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));$("#modal").innerHTML="";start()}catch(e){toast(e.message)}}
function layout(){ $("#app").innerHTML=`<div class="rail"><div class="brand">W</div><button onclick="home()">⌂</button><button onclick="friendsView()">♟</button><button class="plus" onclick="newSpace()">＋</button><div style="flex:1"></div><button onclick="profile()">⚙</button></div><aside class="side"><div class="title">Wecsord <button class="plusbtn" onclick="newSpace()">＋</button></div><div class="label">Мои Spaces</div><div id="spaces"></div><div class="label">Друзья</div><div id="friendMini"></div></aside><main class="main"><div class="top"><span id="channelIcon">◈</span><span class="name" id="channelName">Главная</span><span class="pill" id="channelType">Wecsord</span><button class="ghost" style="width:auto;margin:0" onclick="startCall()" id="callBtn">📞</button></div><div class="messages" id="messages"></div><div class="composer"><input id="message" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Отправить</button></div></main><aside class="right"><div class="label">Сейчас в комнате</div><div id="members"></div><div class="profile"><div class="member"><div class="avatar">${av(me)}</div><div><b>${esc(me.displayName)}</b><div style="font-size:12px;color:#707a8e">@${esc(me.username)}</div></div></div><button onclick="profile()">Настроить профиль</button></div></aside></div>`}
function renderSpaces(){let s=$("#spaces");s.innerHTML=spaces.map(x=>`<div class="item ${currentSpace?.id===x.id?"active":""}" onclick="selectSpace('${x.id}')">◆ ${esc(x.name)}</div>`).join("")||`<div style="color:#687286;padding:8px">Создай первый Space через ＋</div>`;$("#friendMini").innerHTML=friends.slice(0,8).map(u=>`<div class="member"><span class="dot"></span>${esc(u.displayName)}</div>`).join("")}
async function start(){layout();socket.emit("user:online",me.id);let s=await api("/api/spaces/"+me.id);spaces=s.spaces;let f=await api("/api/users/"+me.id+"/friends");friends=f.friends;renderSpaces();home()}
function home(){currentSpace=null;currentChannel=null;renderSpaces();$("#channelName").textContent="Главная";$("#channelType").textContent="Wecsord";$("#messages").innerHTML=`<div class="welcome"><h1>Привет, ${esc(me.displayName)} 👋</h1><p>Создай Space, добавь друзей и начинай общаться. В звонке чат останется рядом с видео.</p><button class="primary" style="height:42px" onclick="newSpace()">Создать Space</button></div>`;$("#members").innerHTML=friends.map(u=>`<div class="member"><div class="avatar">${av(u)}</div><div><b>${esc(u.displayName)}</b><div style="font-size:12px;color:#55d6a5">online</div></div></div>`).join("")}
function selectSpace(id){currentSpace=spaces.find(x=>x.id===id);renderSpaces();$("#channelName").textContent=currentSpace.name;$("#channelType").textContent="Space";$("#messages").innerHTML="";$("#members").innerHTML=currentSpace.members.map(uid=>`<div class="member">👤 ${uid===me.id?esc(me.displayName):"Участник"}</div>`).join("");let c=currentSpace.channels.find(x=>x.type==="text")||currentSpace.channels[0];openChannel(c)}
async function openChannel(c){currentChannel=c;$("#channelName").textContent=c.name;$("#channelType").textContent=c.type==="voice"?"Голосовая":"Текстовая";socket.emit("chat:join",c.id);if(c.type==="voice"){joinVoice(c);$("#messages").innerHTML=`<div class="welcome"><h2>🔊 ${esc(c.name)}</h2><p>Ты можешь говорить, включить камеру или показать экран. Чат остаётся доступным ниже.</p></div>`}else{let d=await api("/api/messages/"+c.id);renderMsgs(d.messages)}}
function renderMsgs(ms){$("#messages").innerHTML=ms.map(m=>`<div class="bubble"><div class="avatar">${av({displayName:m.userId===me.id?me.displayName:"User"})}</div><div><span class="msgname">${m.userId===me.id?esc(me.displayName):"Участник"}</span><span class="time">${new Date(m.at).toLocaleTimeString()}</span><div class="text">${esc(m.text)}</div></div></div>`).join("");$("#messages").scrollTop=999999}
function send(){if(!currentChannel||currentChannel.type!=="text")return toast("Выбери текстовую комнату");let t=$("#message").value.trim();if(!t)return;socket.emit("chat:send",{channelId:currentChannel.id,userId:me.id,text:t});$("#message").value=""}
socket.on("chat:message",m=>{if(m.channelId===currentChannel?.id){let el=document.createElement("div");el.className="bubble";el.innerHTML=`<div class="avatar">${av({displayName:m.userId===me.id?me.displayName:"User"})}</div><div><span class="msgname">${m.userId===me.id?esc(me.displayName):"Участник"}</span><span class="time">${new Date(m.at).toLocaleTimeString()}</span><div class="text">${esc(m.text)}</div></div>`;$("#messages").appendChild(el);$("#messages").scrollTop=999999}});
async function newSpace(){let name=prompt("Название нового Space:","Мой Space");if(!name)return;try{let d=await api("/api/spaces",{method:"POST",body:JSON.stringify({ownerId:me.id,name})});spaces.push(d.space);selectSpace(d.space.id);toast("Space создан! Код: "+d.space.invite)}catch(e){toast(e.message)}}
function profile(){ $("#modal").innerHTML=`<div class="modal"><div class="card"><h2>Профиль</h2><div style="color:#8f99ad;margin-bottom:8px">@${esc(me.username)} — это твой постоянный User</div><input id="pname" value="${esc(me.displayName)}" placeholder="Имя"><input id="pgame" value="${esc(me.game||"")}" placeholder="Во что играешь?"><input id="pavatar" placeholder="Ссылка на аватар (или data:image...)" value=""><div class="row"><button class="primary" onclick="saveProfile()">Сохранить</button><button class="ghost" onclick="closeModal()">Закрыть</button></div></div></div>`}
async function saveProfile(){try{let d=await api("/api/users/"+me.id,{method:"PATCH",body:JSON.stringify({displayName:$("#pname").value,game:$("#pgame").value,avatar:$("#pavatar").value||me.avatar})});me=d.user;localStorage.setItem("wecsordUser",JSON.stringify(me));closeModal();layout();renderSpaces();home();toast("Профиль сохранён")}catch(e){toast(e.message)}}
function closeModal(){$("#modal").innerHTML=""}
async function friendsView(){let q=prompt("Введи User друга для поиска:");if(!q)return;try{let d=await api("/api/search/users?q="+encodeURIComponent(q));let u=d.users.find(x=>x.username.toLowerCase()===q.toLowerCase());if(!u)return toast("User не найден");if(confirm("Отправить заявку @"+u.username+"?")){await api("/api/friends/request",{method:"POST",body:JSON.stringify({from:me.id,to:u.id})});toast("Заявка отправлена")}}catch(e){toast(e.message)}}
function startCall(){let c=currentChannel||{id:"lobby",name:"Общение",type:"voice"};showCall(c)}
async function showCall(c){$("#modal").innerHTML=`<div class="call"><div class="callhead"><b>🔊 ${esc(c.name)}</b><span style="margin-left:auto;color:#55d6a5">● ${esc(me.displayName)}</span><button class="ghost" style="width:auto;margin:0" onclick="closeCall()">×</button></div><div class="callbody"><div class="video"><video id="localVideo" autoplay muted playsinline></video><div id="noVideo">Камера выключена</div></div><div class="callchat"><div class="msgs" id="callMsgs"></div><div class="composer"><input id="callText" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')callSend()"><button onclick="callSend()">→</button></div></div></div><div class="callcontrols"><button onclick="toggleMic()">🎤 Микрофон</button><button onclick="toggleCam()">📹 Камера</button><button onclick="shareScreen()">🖥️ Экран</button><button class="danger" onclick="closeCall()">Завершить</button></div></div>`;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});$("#localVideo").srcObject=localStream;$("#noVideo").classList.add("hidden")}catch(e){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){toast("Браузер не дал доступ к микрофону")}};joinVoice(c)}
function callSend(){let t=$("#callText").value.trim();if(!t)return;let el=document.createElement("div");el.innerHTML="<b>"+esc(me.displayName)+"</b>: "+esc(t);$("#callMsgs").appendChild(el);$("#callText").value=""}
function toggleMic(){let a=localStream?.getAudioTracks()[0];if(a){a.enabled=!a.enabled;toast(a.enabled?"Микрофон включён":"Микрофон выключен")}}
function toggleCam(){let v=localStream?.getVideoTracks()[0];if(v){v.enabled=!v.enabled;$("#noVideo").classList.toggle("hidden",v.enabled)}}
async function shareScreen(){try{let s=await navigator.mediaDevices.getDisplayMedia({video:true});$("#localVideo").srcObject=s;s.getVideoTracks()[0].onended=()=>{if(localStream)$("#localVideo").srcObject=localStream}}catch(e){}}
function joinVoice(c){voiceChannel=c.id;socket.emit("voice:join",{channelId:c.id,user:{id:me.id,displayName:me.displayName}})}
function closeCall(){if(voiceChannel)socket.emit("voice:leave",voiceChannel);localStream?.getTracks().forEach(t=>t.stop());localStream=null;$("#modal").innerHTML=""}
socket.on("voice:user-joined",d=>toast(d.user.displayName+" вошёл в звонок"));
socket.on("voice:user-left",d=>toast("Участник вышел из звонка"));
socket.on("friend:accepted",u=>{friends.push(u);renderSpaces();toast("Новый друг: "+u.displayName)});
socket.on("friend:request",u=>toast("Новая заявка от @"+u.username));
if(!me)showAuth();else start();
</script></body></html>
